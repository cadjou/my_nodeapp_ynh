location ^~ __PATH__/ {

    proxy_pass http://127.0.0.1:__PORT__/;

    include proxy_params_no_auth;
    proxy_redirect http:// https://;

    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Disable buffering for streaming/WebSocket
    proxy_buffering off;

    # Max upload size
    client_max_body_size 50m;

    # Security headers
    more_set_headers "Content-Security-Policy: upgrade-insecure-requests; default-src 'self' https: data: blob:; connect-src 'self' wss://$host https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; img-src 'self' data: https:; font-src 'self' data: https:; worker-src 'self' blob:;";

    # YunoHost SSO panel
    include conf.d/yunohost_panel.conf.inc;
}
